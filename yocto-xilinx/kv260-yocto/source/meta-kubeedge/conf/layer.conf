# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-kubeedge"
BBFILE_PATTERN_meta-kubeedge = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-kubeedge = "6"

LAYERDEPENDS_meta-kubeedge = "core"
LAYERSERIES_COMPAT_meta-kubeedge = "scarthgap"
