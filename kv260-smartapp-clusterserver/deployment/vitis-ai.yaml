---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitis
spec:
  selector:
    matchLabels:
      name: vitis-backend
  template:
    metadata:
      labels:
        name: vitis-backend
    spec:
      containers:
        - name: backend
          image: pm3h/x-vitis-ai:2.5.4
          imagePullPolicy: Always
          command: ["python3","/home/server/vitis-server.py"]
          ports:
            - containerPort: 82
          volumeMounts:
          - mountPath: /dev/shm
            name: shm
          - mountPath: /opt/xilinx/dsa
            name: dsa
          - mountPath: /opt/xilinx/overlaybins
            name: overlay
          - mountPath: /vitis_ai_home
            name: vitis
          - mountPath: /home/workspace
            name: work
          - mountPath: /home/server/vitis-server.py
            name: pyserver
      volumes:
      - name: shm
        hostPath:
          path: /dev/shm
          type: Directory
      - name: dsa
        hostPath:
          path: /opt/xilinx/dsa
          type: Directory
      - name: overlay
        hostPath:
          path: /opt/xilinx/overlaybins
          type: Directory
      - name: vitis
        hostPath:
          path: /home/gary/path2vitisai
          type: Directory
      - name: work
        hostPath:
          path: /home/gary/path2vitisai
          type: Directory
      - name: pyserver
        hostPath:
          path: /home/gary/kv260-smartapp-auto/kv260-smartapp-clusterserver/server/vitis-server.py
          type: File
      nodeSelector:
        id: master
---
apiVersion: v1
kind: Service
metadata:
  name: vitis-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      protocol: TCP
      targetPort: 82
  selector:
    name: vitis-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitis-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: vitis.ai.ninox
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: vitis-service
              port:
                number: 82
