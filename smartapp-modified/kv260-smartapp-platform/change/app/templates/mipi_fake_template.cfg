# Hardcoded mipi source (this board only has one CSI/ISP capture node)
mipi_video_dev=/dev/video0
mipi_media_dev=/dev/media0

echo "mipi : $mipi_video_dev, $mipi_media_dev"

# Configure mipi pipeline
media-ctl -d $mipi_media_dev -V '"ap1302.4-003c":2 [fmt:VYYUYY8_1X24/1920x1080]'
v4l2-ctl -d $mipi_video_dev --set-fmt-video=width=1920,height=1080,pixelformat=NV12

# Launch gstreamer pipeline (streams to dev laptop over UDP/JPEG-RTP instead of fakesink)
gst-launch-1.0 -v \
  v4l2src device=$mipi_video_dev io-mode="dmabuf" stride-align=256 ! \
    video/x-raw,format=NV12,width=1920,height=1080,framerate=30/1 ! \
  tee name=t0 t0.src_0 ! queue ! \
  vvas_xinfer preprocess-config="./jsons/kernel_preprocessor_MODEL.json" infer-config="./jsons/kernel_dpu_MODEL.json" ! \
  scalem0.sink_master vvas_xmetaaffixer name=scalem0 scalem0.src_master ! fakesink \
  t0.src_1 ! queue ! scalem0.sink_slave_0 scalem0.src_slave_0 ! queue ! \
  vvas_xfilter kernels-config="./jsons/kernel_bbox_MODEL.json" ! \
  queue ! videoconvert ! jpegenc ! rtpjpegpay ! udpsink host=192.168.123.128 port=5000 sync=false
